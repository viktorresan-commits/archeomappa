# Prova a mano (Actions → «Diagnosi tasselli» → Run workflow).
# Chiede al servizio vero del Ministero le stesse tessere che chiede l'app attorno a Fabriano, con ogni formato di richiesta
# (varianti A–E di js/varianti.js), e dice: quali tessere danno un'immagine, quali un errore del servizio (con il file che manca),
# quali sono vuote; se un altro formato copre i buchi di quello scelto; se gli errori dipendono dalle richieste in parallelo.
name: Diagnosi tasselli
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Prove
        shell: bash
        run: |
          pip install --quiet pillow 2>&1 | tail -1
          cat > prova.py <<'PY'
          import io, math, re, time, html, collections, traceback, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          M = 20037508.342789244
          PCN = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/"
          def get(url, t=60):
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=t)
                  return r.status, r.headers.get("content-type", ""), r.read(), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type", ""), e.read(), time.time() - t0
              except Exception as e:
                  return 0, "", str(e).encode(), time.time() - t0
          def testo(c, n=260):
              t = html.unescape(re.sub(r"<[^>]+>", " ", c.decode("utf8", "replace")))
              return re.sub(r"\s+", " ", t).strip()[:n]
          def esito(url):
              """('I', %, s) immagine con dati; ('v', 0, s) immagine vuota; ('E', messaggio, s) errore."""
              st, ct, body, s = get(url)
              if st == 200 and ct.startswith("image/"):
                  try:
                      im = Image.open(io.BytesIO(body)).convert("RGBA")
                      a = im.getchannel("A").point(lambda v: 255 if v > 8 else 0)
                      frac = sum(1 for v in a.getdata() if v) / (im.width * im.height)
                      return ("I" if frac > 0.02 else "v"), frac, s
                  except Exception as e:
                      return "E", "immagine illeggibile: %s" % e, s
              return "E", ("HTTP %d %s" % (st, testo(body))), s
          def merc(z, x, y, tile=1):
              n = 2 ** z; lato = 2 * M / n * tile
              return (-M + x * lato, M - (y + 1) * lato, -M + (x + 1) * lato, M - y * lato)
          def tile_di(lat, lon, z):
              n = 2 ** z; return int((lon + 180) / 360 * n), int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)
          def url_wms(base, versione, livelli, bb, px):
              crs = "SRS" if versione == "1.1.1" else "CRS"
              return "%s&SERVICE=WMS&VERSION=%s&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&LAYERS=%s&STYLES=&%s=EPSG:3857&WIDTH=%d&HEIGHT=%d&BBOX=%s" % (base, versione, livelli, crs, px, px, ",".join("%.3f" % v for v in bb))
          def varianti(famiglia, f):
              a = 32 if f == 33 else 33
              both = "%s.32,%s.33" % (famiglia, famiglia)
              return [("A", "1.3.0", both, 512), ("B", "1.3.0", "%s.%d" % (famiglia, f), 512), ("C", "1.1.1", "%s.%d" % (famiglia, f), 256),
                      ("D", "1.1.1", both, 256), ("E", "1.3.0", "%s.%d" % (famiglia, a), 512), ("F", "1.1.1", "%s.%d" % (famiglia, a), 256)]
          def sezione(nome, f):
              print("\n=== " + nome, flush=True)
              try: f()
              except Exception: print("ERRORE nella sezione:", traceback.format_exc()[-800:])
          POSTI = [("Fabriano (fuso 33)", 43.360, 12.900), ("Perugia (fuso 33, Umbria)", 43.110, 12.390), ("Firenze (fuso 32)", 43.770, 11.250)]
          def griglia(nome_serv, base_url, famiglia, lat, lon, Z, lato=5):
              cx, cy = tile_di(lat, lon, Z)
              celle = [(cx + dx, cy + dy) for dy in range(-(lato // 2), lato // 2 + 1) for dx in range(-(lato // 2), lato // 2 + 1)]
              f = 33 if lon >= 12 else 32
              risultati = {}; lavori = []
              for (v, ver, liv, px) in varianti(famiglia, f):
                  if px == 256:
                      for (x, y) in celle: lavori.append((v, (x, y), url_wms(base_url, ver, liv, merc(Z, x, y), 256), [(x, y)]))
                  else:
                      visti = {}
                      for (x, y) in celle: visti.setdefault((x // 2, y // 2), []).append((x, y))
                      for (px_, py_), figli in visti.items(): lavori.append((v, (px_, py_), url_wms(base_url, ver, liv, merc(Z - 1, px_, py_), 512), figli))
              with ThreadPoolExecutor(4) as ex: res = list(ex.map(lambda w: esito(w[2]), lavori))
              per = collections.defaultdict(dict); errori = collections.Counter()
              for (v, k, u, figli), (c, d, s) in zip(lavori, res):
                  for fg in figli: per[v][fg] = c
                  if c == "E": errori[(v, re.sub(r"\d{3,}", "N", str(d))[:200])] += 1
              print("-- %s, %s, zoom %d (griglia %dx%d di tessere da 256, nord in alto)" % (nome_serv, "", Z, lato, lato))
              print("   variante: " + " | ".join("%s=%s" % (v, ver + "/" + liv.replace(famiglia + ".", "") + "/" + str(px)) for (v, ver, liv, px) in varianti(famiglia, f)))
              for v in "ABCDEF":
                  righe = ["".join(per[v][(cx + dx, cy + dy)] for dx in range(-(lato // 2), lato // 2 + 1)) for dy in range(-(lato // 2), lato // 2 + 1)]
                  tot = sum(r.count("I") for r in righe); err = sum(r.count("E") for r in righe); vuote = sum(r.count("v") for r in righe)
                  print("   %s  %s   immagini %2d  vuote %2d  errori %2d" % (v, " ".join(righe), tot, vuote, err))
              unione = sum(1 for c in celle if any(per[v][c] == "I" for v in "ABCDEF"))
              pref = sum(1 for c in celle if per["A"][c] == "I")
              sing = sum(1 for c in celle if per["B"][c] == "I" or per["C"][c] == "I")
              print("   celle con immagine: A (due fusi) %d, B o C (solo il fuso giusto) %d, almeno una variante %d, su %d" % (pref, sing, unione, len(celle)))
              for (v, m), n in errori.most_common(8): print("   errore %s x%d: %s" % (v, n, m))
          def igm_ortofoto():
              for nome, mappa, fam in [("IGM 1:25.000", "raster/IGM_25000.map", "CB.IGM25000"), ("Ortofoto 2012", "raster/ortofoto_colore_12.map", "OI.ORTOIMMAGINI.2012")]:
                  for (np_, lat, lon) in POSTI[:2]:
                      for Z in ([14, 15, 16] if "IGM" in nome else [15, 17]):
                          griglia("%s @ %s" % (nome, np_), PCN + mappa, fam, lat, lon, Z)
          sezione("1) IGM 25.000 e ortofoto 2012: quali tessere, con quale variante", igm_ortofoto)
          def parallelo():
              lat, lon, Z = 43.360, 12.900, 15; cx, cy = tile_di(lat, lon, Z)
              urls = [url_wms(PCN + "raster/IGM_25000.map", "1.1.1", "CB.IGM25000.33", merc(Z, cx + dx, cy + dy), 256) for dy in range(-3, 4) for dx in range(-3, 4)]
              for nome, n in [("una alla volta", 1), ("4 insieme", 4), ("8 insieme", 8), ("16 insieme", 16)]:
                  t0 = time.time()
                  with ThreadPoolExecutor(n) as ex: r = list(ex.map(esito, urls))
                  print("%-16s %2d richieste in %5.1f s: immagini %d, vuote %d, errori %d, tempo medio %.2f s, massimo %.2f s" % (nome, len(urls), time.time() - t0, sum(1 for c in r if c[0] == "I"), sum(1 for c in r if c[0] == "v"), sum(1 for c in r if c[0] == "E"), sum(c[2] for c in r) / len(r), max(c[2] for c in r)))
                  errs = collections.Counter(re.sub(r"\d{3,}", "N", str(c[1]))[:140] for c in r if c[0] == "E")
                  for m, k in errs.most_common(3): print("     errore x%d: %s" % (k, m))
          sezione("2) le richieste in parallelo fanno più errori?", parallelo)
          def ripetizione():
              # lo stesso tassello chiesto 6 volte: l'errore è sempre lo stesso (guasto del file) o a volte passa (servizio sovraccarico)?
              lat, lon, Z = 43.360, 12.900, 15; cx, cy = tile_di(lat, lon, Z)
              prima = [(dx, dy, esito(url_wms(PCN + "raster/IGM_25000.map", "1.1.1", "CB.IGM25000.33", merc(Z, cx + dx, cy + dy), 256))[0]) for dy in range(-2, 3) for dx in range(-2, 3)]
              cattive = [(dx, dy) for dx, dy, c in prima if c == "E"]
              print("tessere in errore alla prima richiesta:", len(cattive), "su", len(prima))
              for dx, dy in cattive[:6]:
                  rip = [esito(url_wms(PCN + "raster/IGM_25000.map", "1.1.1", "CB.IGM25000.33", merc(Z, cx + dx, cy + dy), 256))[0] for _ in range(6)]
                  print("   tessera %+d,%+d: 6 richieste di seguito -> %s" % (dx, dy, "".join(rip)))
          sezione("3) un tassello in errore lo è sempre? (se a volte passa, riprovare serve)", ripetizione)
          def lidar():
              base = PCN + "servizi-LiDAR/LIDAR_MARCHE.map"
              for Z in (15, 16, 17):
                  cx, cy = tile_di(43.360, 12.900, Z); celle = [(cx + dx, cy + dy) for dy in range(-3, 4) for dx in range(-3, 4)]
                  for liv in ("EL.LIDAR.MARCHE.1x1.DTM", "EL.LIDAR.MARCHE.2x2.DTM", "EL.LIDAR.MARCHE.1x1.DSM_FIRST"):
                      with ThreadPoolExecutor(4) as ex: r = list(ex.map(lambda c: esito(url_wms(base, "1.1.1", liv, merc(Z, *c), 256)), celle))
                      s = "".join(c[0] for c in r)
                      tempo = sum(c[2] for c in r) / len(r)
                      print("zoom %d %-34s %s  (I=immagine, v=vuota, E=errore; tempo medio %.2f s)" % (Z, liv, "/".join(s[i:i + 7] for i in range(0, 49, 7)), tempo))
                      errs = collections.Counter(re.sub(r"\d{3,}", "N", str(c[1]))[:140] for c in r if c[0] == "E")
                      for m, k in errs.most_common(2): print("     errore x%d: %s" % (k, m))
          sezione("4) LiDAR Marche: immagini, vuote, errori per zoom e prodotto", lidar)
          def colore():
              # i due «LiDAR»: l'immagine è in grigi o a colori? (media dei canali RGB dove c'è dato)
              base = PCN + "servizi-LiDAR/LIDAR_MARCHE.map"; Z = 16; cx, cy = tile_di(43.360, 12.900, Z)
              for liv in ("EL.LIDAR.MARCHE.1x1.DTM", "EL.LIDAR.MARCHE.2x2.DTM", "EL.LIDAR.MARCHE.1x1.DSM_FIRST", "EL.LIDAR.MARCHE.1x1.DSM_LAST"):
                  for dx in (-1, 0, 1):
                      st, ct, body, s = get(url_wms(base, "1.1.1", liv, merc(Z, cx + dx, cy), 256))
                      if st == 200 and ct.startswith("image/"):
                          im = Image.open(io.BytesIO(body)).convert("RGBA"); px = [p for p in im.getdata() if p[3] > 8]
                          if px:
                              grigi = sum(1 for p in px if max(p[:3]) - min(p[:3]) < 6) / len(px)
                              print("%-34s tessera %+d: pixel con dato %d%%, in grigio %d%% (resto a colori), %s %dx%d" % (liv, dx, 100 * len(px) // (im.width * im.height), 100 * grigi, im.mode, im.width, im.height))
                          else: print("%-34s tessera %+d: vuota" % (liv, dx))
                      else: print("%-34s tessera %+d: %s" % (liv, dx, testo(body, 120)))
          sezione("5) LiDAR: grigi o colori?", colore)
          PY
          python3 prova.py 2>&1 | tee uscita.txt
