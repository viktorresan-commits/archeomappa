# Prova a mano (Actions → «Diagnosi LiDAR» → Run workflow): terza parte.
# 1) GetCapabilities dei servizi LiDAR di Marche e Umbria: livelli, stili, soglie di scala, riquadri geografici;
# 2) GetMap a vari ingrandimenti e luoghi: la tessera è a grigi o a colori? ha dati? (base64 nel registro per vederle);
# 3) tessere di prova dei cataloghi storici (CASTORE, Alto Adige 1858) e della carta Inghirami;
# 4) copertura di Esri Clarity in aree rurali e confronto con la tessera «dato non disponibile».
name: Diagnosi LiDAR
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prove
        shell: bash
        run: |
          pip install --quiet pillow numpy 2>&1 | tail -1
          cat > prova.py <<'PY'
          import io, math, re, time, html, base64, traceback, hashlib, urllib.request, urllib.error
          from PIL import Image
          UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          M = 20037508.342789244
          def get(url, t=60):
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Origin": "https://viktorresan-commits.github.io"}), timeout=t)
                  return r.status, dict((k.lower(), v) for k, v in r.headers.items()), r.read(), time.time() - t0
              except urllib.error.HTTPError as e:
                  return e.code, dict((k.lower(), v) for k, v in e.headers.items()), e.read(), time.time() - t0
              except Exception as e:
                  return 0, {}, str(e).encode(), time.time() - t0
          def testo(c, n=240):
              t = html.unescape(re.sub(r"<[^>]+>", " ", c.decode("utf8", "replace"))); return re.sub(r"\s+", " ", t).strip()[:n]
          def tile_di(lat, lon, z):
              n = 2 ** z; return int((lon + 180) / 360 * n), int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)
          def merc(z, x, y):
              s = 2 * M / 2 ** z; return (-M + x * s, M - (y + 1) * s, -M + (x + 1) * s, M - y * s)
          def sezione(nome, f):
              print("\n=== " + nome, flush=True)
              try: f()
              except Exception: print("ERRORE nella sezione:", traceback.format_exc()[-800:])
          def wms(base, versione, livelli, bb, px=256, crs="EPSG:3857", stili=""):
              sep = "&" if "?" in base else "?"
              nome = "SRS" if versione == "1.1.1" else "CRS"
              return "%s%sSERVICE=WMS&VERSION=%s&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&LAYERS=%s&STYLES=%s&%s=%s&WIDTH=%d&HEIGHT=%d&BBOX=%s" % (base, sep, versione, livelli, stili, nome, crs, px, px, ",".join("%.3f" % v for v in bb))
          def analisi(b):
              im = Image.open(io.BytesIO(b)).convert("RGBA")
              a = im.getchannel("A"); dati = [v for v in a.getdata() if v > 8]
              frac = len(dati) / (im.width * im.height)
              rgb = im.convert("RGB"); hsv = rgb.convert("HSV")
              sat = [s for (h, s, v), al in zip(hsv.getdata(), a.getdata()) if al > 8]
              ms = (sum(sat) / len(sat)) if sat else 0
              return im.size, frac, ms
          def piccola(b):
              im = Image.open(io.BytesIO(b)).convert("RGBA")
              fondo = Image.new("RGBA", im.size, (200, 60, 200, 255)); fondo.alpha_composite(im)
              out = io.BytesIO(); fondo.convert("RGB").save(out, "JPEG", quality=55); return out.getvalue()
          def stampa_img(nome, b):
              try: r = piccola(b)
              except Exception: r = b
              print("IMG %s %d %s" % (nome, len(r), base64.b64encode(r).decode()), flush=True)
          def prova_tessera(etichetta, url, salva=False):
              st, h, b, s = get(url)
              if st == 200 and h.get("content-type", "").startswith("image/"):
                  try:
                      dim, frac, ms = analisi(b)
                      print("   %-52s %dx%d %6d byte, con dati %3d%%, saturazione media %3d/255 (%s), %.1f s" % (etichetta, dim[0], dim[1], len(b), round(100 * frac), ms, "COLORI" if ms > 40 else "grigi", s), flush=True)
                      if salva and frac > 0.02: stampa_img(etichetta.replace(" ", "_"), b)
                  except Exception as e:
                      print("   %-52s immagine illeggibile: %s" % (etichetta, e))
              else:
                  print("   %-52s HTTP %d %s: %s" % (etichetta, st, h.get("content-type", ""), testo(b, 200)), flush=True)
          PCN = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/servizi-LiDAR/"
          def capab():
              for mappa in ("LIDAR_MARCHE.map", "LIDAR_UMBRIA_2.map"):
                  for ver in ("1.1.1", "1.3.0"):
                      st, h, b, s = get(PCN + mappa + "&SERVICE=WMS&REQUEST=GetCapabilities&VERSION=" + ver)
                      t = b.decode("utf8", "replace")
                      print("%s GetCapabilities %s: HTTP %d, %d byte, %.1f s" % (mappa, ver, st, len(b), s))
                      if st != 200 or "<Layer" not in t:
                          print("   ", testo(b, 300)); continue
                      for blocco in re.findall(r"<Layer[^>]*>.*?</Layer>", t, re.S):
                          nome = re.search(r"<Name>([^<]+)</Name>", blocco)
                          if not nome or "LIDAR" not in nome.group(1).upper(): continue
                          titolo = re.search(r"<Title>([^<]*)</Title>", blocco)
                          stili = re.findall(r"<Style>\s*<Name>([^<]*)</Name>", blocco)
                          scala = re.findall(r"<(?:Min|Max)ScaleDenominator>([^<]*)<", blocco) + re.findall(r"<ScaleHint[^>]*/>", blocco)
                          bb = re.search(r"<(?:LatLonBoundingBox|EX_GeographicBoundingBox)[^>]*>.*?(?:</EX_GeographicBoundingBox>|/>)", blocco, re.S)
                          print("   livello %-34s %s | stili %s | scala %s | %s" % (nome.group(1), titolo.group(1) if titolo else "", stili or "—", scala or "—", re.sub(r"\s+", " ", bb.group(0))[:160] if bb else "—"))
                      break
          sezione("1) GetCapabilities dei servizi LiDAR", capab)
          def elenco_livelli(url):
              st, h, b, _ = get(url + "&SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.1.1")
              return re.findall(r"<Name>([^<]+)</Name>", b.decode("utf8", "replace"))
          def getmap():
              for reg, mappa, lat, lon in (("MARCHE", "LIDAR_MARCHE.map", 43.337, 12.905), ("UMBRIA", "LIDAR_UMBRIA_2.map", 43.110, 12.389)):
                  base = PCN + mappa
                  nomi = [n for n in elenco_livelli(base) if "LIDAR" in n.upper()]
                  print("-- %s: tutti i nomi di livello nel servizio: %s" % (reg, ", ".join(nomi)))
                  scelti = [n for n in nomi if re.search(r"1x1\.(DTM|DSM_LAST)$|\.(1x1|MARCHE|UMBRIA)$", n)][:6]
                  for liv in scelti:
                      for z in (13, 16):
                          x, y = tile_di(lat, lon, z)
                          prova_tessera("%s 1.1.1 3857 z%d" % (liv, z), wms(base, "1.1.1", liv, merc(z, x, y)), z == 16)
                      x, y = tile_di(lat, lon, 15)
                      bb = merc(15, x, y)
                      prova_tessera("%s 1.3.0 3857 z15" % liv, wms(base, "1.3.0", liv, bb))
                      prova_tessera("%s 1.1.1 512px z15" % liv, wms(base, "1.1.1", liv, bb, px=512))
                      # gradi: stesso riquadro in EPSG:4326 (asse x = lon)
                      def ing(xm, ym): return (xm / M * 180, math.degrees(2 * math.atan(math.exp(ym / M * math.pi)) - math.pi / 2))
                      (lo0, la0), (lo1, la1) = ing(bb[0], bb[1]), ing(bb[2], bb[3])
                      prova_tessera("%s 1.1.1 4326 z15" % liv, "%s&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&LAYERS=%s&STYLES=&SRS=EPSG:4326&WIDTH=256&HEIGHT=256&BBOX=%.6f,%.6f,%.6f,%.6f" % (base, liv, lo0, la0, lo1, la1))
                  # il valore vero in un punto (come fa l'app per misurare i metri)
                  for liv in scelti[:3]:
                      cx = lon * M / 180; cy = math.log(math.tan(math.pi / 4 + math.radians(lat) / 2)) * M / math.pi
                      u = "%s&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=%s&QUERY_LAYERS=%s&STYLES=&SRS=EPSG:3857&BBOX=%.3f,%.3f,%.3f,%.3f&WIDTH=3&HEIGHT=3&X=1&Y=1&INFO_FORMAT=text/plain" % (base, liv, liv, cx - 1.5, cy - 1.5, cx + 1.5, cy + 1.5)
                      st, h, b, s = get(u)
                      print("   GetFeatureInfo %-34s HTTP %d: %s" % (liv, st, testo(b, 160)))
          sezione("2) LiDAR: nomi dei livelli, varianti di richiesta, valore in un punto", getmap)
          def tinitaly():
              base = "https://tinitaly.pi.ingv.it/TINItaly_1_1/wms"
              st, h, b, s = get(base + "?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.1.1")
              t = b.decode("utf8", "replace")
              print("TINITALY capabilities HTTP %d, %d byte" % (st, len(b)))
              coppie = re.findall(r"<Name>([^<]+)</Name>\s*<Title>([^<]*)</Title>", t)
              for n, ti in coppie: print("   livello %s — %s" % (n, ti))
              for liv in [n for n, _ in coppie][:8]:
                  x, y = tile_di(43.337, 12.905, 13)
                  prova_tessera("TINITALY %s z13" % liv, wms(base, "1.1.1", liv, merc(13, x, y)), True)
          sezione("3) TINITALY: livelli disponibili e aspetto", tinitaly)
          def immagine(nome, url, z, lat, lon):
              x, y = tile_di(lat, lon, z)
              st, h, b, s = get(url(z, x, y))
              if st == 200 and h.get("content-type", "").startswith("image/"): stampa_img(nome, b)
              else: print("IMG %s ERR%s %s" % (nome, st, testo(b, 120)), flush=True)
          def storici():
              C = "https://www502.regione.toscana.it/cartografia/wmsraster/com.rt.wms.RTmap/wms?map=wmscastore&"
              for liv, z in (("r_toscan_cst_fogli", 16), ("r_toscan_cst_fogli", 14), ("r_toscan_cst_inghirami", 13), ("r_toscan_cst_inghirami", 15), ("r_toscan_cst_riempimento_raster", 15), ("r_toscan_cst_quadri_unione", 13), ("r_toscan_castore2", 15), ("r_toscan_cst_sezioni_topo.5", 15)):
                  immagine("CASTORE_%s_z%d" % (liv.replace("r_toscan_", ""), z), lambda z, x, y, liv=liv: wms(C, "1.3.0", liv, merc(z, x, y)), z, 43.7696, 11.2558)
              A = "https://geoservices5.civis.bz.it/geoserver/ows"
              for liv in ("p_bz-Cadastre-Historical:Cadastre1858", "p_bz-Cadastre-Historical:Cadastre1858-Map"):
                  immagine("ALTOADIGE_%s_z16" % liv.split(":")[1], lambda z, x, y, liv=liv: wms(A, "1.3.0", liv, merc(z, x, y)), 16, 46.4983, 11.3548)
              st, h, b, s = get(A + "?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0")
              t = b.decode("utf8", "replace")
              for n, ti in re.findall(r"<Layer[^>]*>\s*<Name>([^<]*[Cc]adastre[^<]*)</Name>\s*<Title>([^<]*)</Title>", t): print("   livello Alto Adige %s — %s" % (n, ti))
          sezione("4) tessere dei servizi storici", storici)
          def clarity():
              CL = "https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/%d/%d/%d"
              WI = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%d/%d/%d"
              for nome, lat, lon in (("Sardegna interna", 40.05, 9.30), ("Alpi", 46.50, 11.90), ("Sicilia interna", 37.50, 14.30), ("Basilicata", 40.55, 16.10), ("Friuli", 46.20, 13.10), ("Puglia", 40.90, 16.40)):
                  for z in (16, 17, 18):
                      x, y = tile_di(lat, lon, z)
                      sc, hc, bc, _ = get(CL % (z, y, x)); se, he, be, _ = get(WI % (z, y, x))
                      print("   %-18s z%d Clarity: HTTP %d %6d byte md5 %s | World Imagery: HTTP %d %6d byte md5 %s" % (nome, z, sc, len(bc), hashlib.md5(bc).hexdigest()[:8], se, len(be), hashlib.md5(be).hexdigest()[:8]))
          sezione("5) copertura di Esri Clarity in aree rurali", clarity)
          PY
          python3 prova.py 2>&1 | tee uscita.txt
