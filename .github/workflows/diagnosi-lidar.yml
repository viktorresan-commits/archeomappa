# Prova a mano (Actions → «Diagnosi LiDAR» → Run workflow): interroga il servizio LiDAR del Ministero
# con le stesse richieste dell'app (GetMap da 256, 512 e 1000 pixel; GetFeatureInfo per le quote in metri)
# e scrive tempi, tipo di risposta e contenuto. Non tocca l'app.
name: Diagnosi LiDAR
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Richieste GetMap e GetFeatureInfo
        shell: bash
        run: |
          pip install --quiet pillow 2>&1 | tail -1
          cat > prova.py <<'PY'
          import io, math, re, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          BASE = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/servizi-LiDAR/LIDAR_MARCHE.map"
          LIV = "EL.LIDAR.MARCHE.1x1.DTM"
          M = 20037508.342789244
          def tessera(lat, lon, z):
              n = 2**z
              x = int((lon+180)/360*n); y = int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
              s = 2*M/n
              return (-M+x*s, M-(y+1)*s, -M+(x+1)*s, M-y*s), s
          def get(url, t=90):
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"}), timeout=t)
                  return r.status, r.headers.get("Content-Type", ""), r.read(), time.time()-t0
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), e.read(), time.time()-t0
              except Exception as e:
                  return 0, "", str(e).encode(), time.time()-t0
          def getmap(bbox, px):
              return f"{BASE}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS={LIV}&STYLES=&SRS=EPSG:3857&BBOX={','.join('%.3f' % v for v in bbox)}&WIDTH={px}&HEIGHT={px}&FORMAT=image/png&TRANSPARENT=true"
          def quota(x, y):
              b = ",".join("%.3f" % v for v in (x-1.5, y-1.5, x+1.5, y+1.5))
              return f"{BASE}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS={LIV}&QUERY_LAYERS={LIV}&STYLES=&SRS=EPSG:3857&BBOX={b}&WIDTH=3&HEIGHT=3&X=1&Y=1&INFO_FORMAT=text/plain"
          def descrivi(corpo, tipo):
              if "image" in tipo:
                  im = Image.open(io.BytesIO(corpo)).convert("RGBA"); a = im.getchannel("A"); g = im.convert("L")
                  op = sum(1 for v in a.getdata() if v > 8) / (im.width*im.height)
                  vals = [p for p, v in zip(g.getdata(), a.getdata()) if v > 8]
                  return f"{im.width}x{im.height}, opaco {op:.0%}, grigi {min(vals) if vals else '-'}..{max(vals) if vals else '-'}"
              t = re.sub(r"<[^>]+>", " ", corpo.decode("utf8", "replace")); t = re.sub(r"\s+", " ", t).strip()
              return "TESTO: " + t[:400]
          def merc(lat, lon):
              return lon*M/180, math.log(math.tan(math.pi/4+math.radians(lat)/2))*M/math.pi
          def finestra(lat, lon, lato_m):
              cx, cy = merc(lat, lon); k = 1/math.cos(math.radians(lat)); m = lato_m*k/2
              return (cx-m, cy-m, cx+m, cy+m)
          # 1) dove ci sono dati? scansione grossolana (finestre di 1 km, 24 px) sulle Marche
          punti = [(43.95 - 0.05*i, 12.2 + 0.05*j) for i in range(28) for j in range(35)]
          def opaco(pt):
              st, tipo, corpo, dt = get(getmap(finestra(pt[0], pt[1], 1000), 24), 60)
              if "image" not in tipo: return pt, -1
              im = Image.open(io.BytesIO(corpo)).convert("RGBA")
              return pt, sum(1 for v in im.getchannel("A").getdata() if v > 8)/(im.width*im.height)
          t0 = time.time()
          with ThreadPoolExecutor(16) as ex: ris = list(ex.map(opaco, punti))
          print(f"scansione di {len(punti)} finestre in {time.time()-t0:.0f}s; con dati: {sum(1 for _,o in ris if o > 0.5)}; errori: {sum(1 for _,o in ris if o < 0)}")
          for i in range(28):
              print(f"{43.95-0.05*i:5.2f} " + "".join("#" if ris[i*35+j][1] > 0.5 else ("+" if ris[i*35+j][1] > 0.05 else ("!" if ris[i*35+j][1] < 0 else ".")) for j in range(35)))
          print("      lon 12.2 → 13.9 (passo 0,05°)")
          buoni = sorted((p for p, o in ris if o > 0.9), key=lambda p: (p[0]-43.337)**2 + (p[1]-12.905)**2)
          if not buoni: raise SystemExit("nessuna finestra con dati")
          lat, lon = buoni[0]
          print(f"--- prove in {lat:.4f} N {lon:.4f} E (finestra con dati più vicina a Fabriano)")
          bb = finestra(lat, lon, 1200)
          imgs = {}
          for px in (256, 512, 1000):
              st, tipo, corpo, dt = get(getmap(bb, px))
              print(f"GetMap {px} px: HTTP {st} {dt:.1f}s {len(corpo)} B → {descrivi(corpo, tipo)}")
              if "image" in tipo: imgs[px] = Image.open(io.BytesIO(corpo)).convert("RGBA")
          print("--- immagini (base64, per guardarle) e letture di quota punto per punto")
          import base64
          for px in (256, 512):
              st, tipo, corpo, dt = get(getmap(bb, px))
              if px == 256:
                  print("PNG256-INIZIO"); print(base64.b64encode(corpo).decode()); print("PNG256-FINE")
              im = Image.open(io.BytesIO(corpo)); print(f"{px} px: modo PNG {im.mode}")
              im = im.convert("RGBA"); w, h = im.size; pix = im.load()
              grigio = sum(1 for r in range(0, h, 4) for c in range(0, w, 4) if pix[c, r][0] == pix[c, r][1] == pix[c, r][2]) / ((h//4)*(w//4))
              colori = len(set(pix[c, r][:3] for r in range(0, h, 2) for c in range(0, w, 2)))
              print(f"   pixel con R=G=B: {grigio:.0%}; colori distinti: {colori}")
              righe = []
              for i in range(12):
                  c = int((i+0.5)*w/12); r = h//2
                  x = bb[0] + (c+0.5)*(bb[2]-bb[0])/w; y = bb[3] - (r+0.5)*(bb[3]-bb[1])/h
                  st, tipo2, corpo2, dt2 = get(quota(x, y), 60)
                  testo = re.sub(r"\s+", " ", corpo2.decode("utf8", "replace")).strip()
                  m = re.search(r"@16 Stretched value;Pixel Value; (-?[\d.]+);(-?[\d.]+);", testo)
                  righe.append(f"   c={c:4d} immagine RGB={pix[c, r][:3]} alfa={pix[c, r][3]}  servizio: grigio {m.group(1) if m else '?'} quota {m.group(2) if m else testo[:80]}")
              print("\n".join(righe))
          print("--- 12 tessere con dati in parallelo (256 e 512 px)")
          bz, sz = tessera(lat, lon, 15)
          for px in (256, 512):
              t0 = time.time()
              with ThreadPoolExecutor(12) as ex:
                  esiti = list(ex.map(lambda k: get(getmap((bz[0]+(k%4)*sz, bz[1]+(k//4)*sz, bz[2]+(k%4)*sz, bz[3]+(k//4)*sz), px)), range(12)))
              print(f"{px} px: totale {time.time()-t0:.1f}s; stati {sorted(set(e[0] for e in esiti))}; tempo max {max(e[3] for e in esiti):.1f}s; byte {sum(len(e[2]) for e in esiti)//1024} KB")
          PY
          python3 prova.py
