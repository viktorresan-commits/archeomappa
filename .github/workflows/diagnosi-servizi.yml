# Prova a mano (Actions → «Diagnosi servizi» → Run workflow): interroga i servizi usati dall'app (LiDAR del Ministero,
# TINITALY, mappe di base, IGM) con le stesse richieste dell'app e scrive stato, tipo di risposta e contenuto.
# Non tocca l'app. Serve a distinguere un guasto dell'app da un guasto del server.
name: Diagnosi servizi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Richieste ai servizi
        shell: bash
        run: |
          pip install --quiet pillow 2>&1 | tail -1
          cat > prova.py <<'PY'
          import io, math, re, time, urllib.request, urllib.error
          from PIL import Image
          M = 20037508.342789244
          UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          def get(url, t=60):
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "http://localhost/"}), timeout=t)
                  return r.status, r.headers.get("Content-Type", ""), r.read(), time.time()-t0
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), e.read(), time.time()-t0
              except Exception as e:
                  return 0, "", str(e).encode(), time.time()-t0
          def descrivi(corpo, tipo):
              if "image" in tipo:
                  try:
                      im = Image.open(io.BytesIO(corpo)).convert("RGBA"); a = list(im.getchannel("A").getdata())
                      return f"immagine {im.width}x{im.height}, opaco {sum(1 for v in a if v > 8)/len(a):.0%}"
                  except Exception as e: return f"immagine illeggibile ({e})"
              t = re.sub(r"<[^>]+>", " ", corpo.decode("utf8", "replace")); t = re.sub(r"\s+", " ", t).strip()
              return "TESTO: " + t[:300]
          def tile(lat, lon, z):
              n = 2**z
              return int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          def bbox3857(lat, lon, z):
              x, y = tile(lat, lon, z); s = 2*M/2**z
              return (-M+x*s, M-(y+1)*s, -M+(x+1)*s, M-y*s)
          def prova(nome, url):
              st, tipo, corpo, dt = get(url)
              print(f"{nome}: HTTP {st}, {tipo.split(';')[0]}, {dt:.1f}s, {len(corpo)} B → {descrivi(corpo, tipo)}")
              return corpo
          print("=== LiDAR del Ministero (Marche, DTM 1 m), zona con dati vicino a Fabriano")
          L = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/servizi-LiDAR/LIDAR_MARCHE.map"
          LV = "EL.LIDAR.MARCHE.1x1.DTM"
          cx = 12.90*M/180; cy = math.log(math.tan(math.pi/4+math.radians(43.40)/2))*M/math.pi
          m = 600/math.cos(math.radians(43.40))
          bl = (cx-m, cy-m, cx+m, cy+m)
          for px in (256, 512, 1000):
              prova(f"GetMap {px} px", f"{L}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS={LV}&STYLES=&SRS=EPSG:3857&BBOX={','.join('%.3f' % v for v in bl)}&WIDTH={px}&HEIGHT={px}&FORMAT=image/png&TRANSPARENT=true")
          esiti = {}
          for i in range(24):
              x = cx + (i % 6 - 3)*60; y = cy + (i // 6 - 2)*60
              b = ",".join("%.3f" % v for v in (x-1.5, y-1.5, x+1.5, y+1.5))
              st, tipo, corpo, dt = get(f"{L}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS={LV}&QUERY_LAYERS={LV}&STYLES=&SRS=EPSG:3857&BBOX={b}&WIDTH=3&HEIGHT=3&X=1&Y=1&INFO_FORMAT=text/plain")
              k = "quota letta" if re.search(rb"Stretched value;Pixel Value; -?[\d.]+;-?[\d.]+;", corpo) else f"HTTP {st} senza quota"
              esiti[k] = esiti.get(k, 0) + 1
          print("GetFeatureInfo (24 letture):", esiti)
          lat, lon = 43.337, 12.905
          print("=== Ombre: TINITALY (WMS GeoServer dell'INGV)")
          B = "https://tinitaly.pi.ingv.it/TINItaly_1_1/wms"
          cap = get(B + "?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities", 90)
          print("GetCapabilities:", cap[0], cap[1].split(";")[0], f"{cap[3]:.1f}s", len(cap[2]), "B")
          testo = cap[2].decode("utf8", "replace")
          nomi = re.findall(r"<Name>([^<]+)</Name>", testo)
          print("livelli:", nomi[:40])
          print("SRS ammessi (primi):", sorted(set(re.findall(r"<SRS>([^<]+)</SRS>", testo)))[:12])
          for px in (256, 512):
              for liv in [n for n in nomi if "hs" in n.lower() or "shade" in n.lower() or "hshd" in n.lower()][:4] or ["tinitaly_hshd"]:
                  b = bbox3857(lat, lon, 14)
                  prova(f"GetMap {liv} {px}px 1.1.1", f"{B}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS={liv}&STYLES=&FORMAT=image/png&TRANSPARENT=true&SRS=EPSG:3857&WIDTH={px}&HEIGHT={px}&BBOX={','.join(str(v) for v in b)}")
          print("=== Ombre: Esri World Hillshade (ripiego)")
          x, y = tile(lat, lon, 12)
          prova("Esri tile z12", f"https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/12/{y}/{x}")
          print("=== Mappe di base nuove (z12)")
          x, y = tile(lat, lon, 12)
          for nome, url in [
              ("CyclOSM", f"https://a.tile-cyclosm.openstreetmap.fr/cyclosm/12/{x}/{y}.png"),
              ("HOT", f"https://a.tile.openstreetmap.fr/hot/12/{x}/{y}.png"),
              ("CARTO Voyager", f"https://a.basemaps.cartocdn.com/rastertiles/voyager/12/{x}/{y}.png"),
              ("CARTO Positron", f"https://a.basemaps.cartocdn.com/light_all/12/{x}/{y}.png"),
              ("Sentinel-2 EOX", f"https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/12/{y}/{x}.jpg"),
              ("OpenTopoMap", f"https://a.tile.opentopomap.org/12/{x}/{y}.png"),
          ]: prova(nome, url)
          print("=== Ministero: IGM 25000 (come l'app)")
          P = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/raster/IGM_25000.map"
          b = bbox3857(lat, lon, 14)
          prova("IGM25000 z14 256px CB.IGM25000.33", f"{P}&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=CB.IGM25000.33&STYLES=&SRS=EPSG:3857&BBOX={','.join('%.3f' % v for v in b)}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true")
          PY
          python3 prova.py
