# Prova a mano (Actions → «Verifica livelli» → Run workflow): ogni mappa e livello del registro con una richiesta vera.
name: Verifica livelli
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove
        run: node scripts/verifica-livelli.mjs 2>&1 | tee uscita.txt
