# Prova a mano (Actions → «Diagnosi 3D Ministero» → Run workflow): seconda parte della prova delle fonti di quota.
# 1) com'è fatto il GeoTIFF che TINITALY dà dal WCS (per leggerlo nel browser) e quanto costa per tessera;
# 2) se il WCS del Ministero dà il LiDAR 1 m come quota vera; 3) se i palazzi di OpenFreeMap hanno l'altezza.
name: Diagnosi 3D Ministero
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prove
        shell: bash
        run: |
          pip install --quiet pillow numpy tifffile imagecodecs mapbox-vector-tile 2>&1 | tail -1
          cat > prova.py <<'PY'
          import io, math, re, time, traceback, urllib.request, urllib.error, gzip
          from concurrent.futures import ThreadPoolExecutor
          import numpy as np
          from PIL import Image
          import tifffile
          UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          ORIGINE = "https://viktorresan-commits.github.io"
          M = 20037508.342789244
          def get(url, t=120, intest=None):
              t0 = time.time(); h = {"User-Agent": UA}
              if intest: h.update(intest)
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=t)
                  return r.status, dict((k.lower(), v) for k, v in r.headers.items()), r.read(), time.time()-t0
              except urllib.error.HTTPError as e:
                  return e.code, dict((k.lower(), v) for k, v in e.headers.items()), e.read(), time.time()-t0
              except Exception as e:
                  return 0, {}, str(e).encode(), time.time()-t0
          def testo(c, n=300):
              t = re.sub(r"<[^>]+>", " ", c.decode("utf8", "replace")); return re.sub(r"\s+", " ", t).strip()[:n]
          def sezione(nome, f):
              print(f"\n=== {nome}")
              try: return f()
              except Exception: print("ERRORE nella sezione:", traceback.format_exc()[-700:])
          def leggi_tiff(c):
              with tifffile.TiffFile(io.BytesIO(c)) as t:
                  p = t.pages[0]; return p.asarray(), p
          def merc_bbox(z, x, y):
              s = 2*M/2**z; return (-M+x*s, M-(y+1)*s, -M+(x+1)*s, M-y*s)
          def tile(lat, lon, z):
              n = 2**z; return int((lon+180)/360*n), int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*n)
          T = "https://tinitaly.pi.ingv.it/TINItaly_1_1/wcs"
          def tin_url(bb, crs, w, h):
              return f"{T}?service=WCS&version=1.0.0&request=GetCoverage&coverage=TINItaly_1_1:tinitaly_dem&crs={crs}&bbox={','.join('%.6f' % v for v in bb)}&width={w}&height={h}&format=GeoTIFF"
          LAT, LON = 43.337, 12.905
          # ---------- 1) com'è fatto il file di TINITALY
          def struttura():
              d = 0.01
              c = get(tin_url((LON-d, LAT-d, LON+d, LAT+d), "EPSG:4326", 256, 256))[2]
              print("byte:", len(c), "intestazione (hex):", c[:96].hex())
              a, p = leggi_tiff(c)
              print("ordine byte:", p.parent.byteorder, "| dtype", a.dtype, "| forma", a.shape, "| compressione", p.compression.name, "| predittore", p.predictor.name, "| campioni/pixel", p.samplesperpixel)
              print("righe per striscia:", p.rowsperstrip, "| strisce:", len(p.dataoffsets), "| offset prima striscia:", p.dataoffsets[0], "| byte prima striscia:", p.databytecounts[0])
              for tg in p.tags.values():
                  v = tg.value
                  s = str(v)
                  print("  tag", tg.code, tg.name, "=", s[:150])
              nd = (a <= -9998)
              print(f"pixel senza dato (-9999): {nd.sum()} su {a.size} ({nd.mean():.1%}); righe/colonne coinvolte: righe {np.where(nd.any(axis=1))[0][[0,-1]] if nd.any() else '-'}, colonne {np.where(nd.any(axis=0))[0][[0,-1]] if nd.any() else '-'}")
              v = a[~nd]; print(f"quote valide: {v.min():.2f}..{v.max():.2f} m, valori distinti {len(np.unique(v))}")
              print("ritaglio 6x10 centrale:");
              for r in range(125, 131): print("   ", " ".join(f"{x:7.1f}" for x in a[r, 120:130]))
          sezione("TINITALY WCS 1.0.0: com'è fatto il GeoTIFF", struttura)
          # ---------- 2) tessere in Web Mercator: formato, tempi, correttezza
          def mercatore():
              for z, px in ((13, 256), (13, 512), (13, 1024), (14, 256), (14, 512)):
                  x, y = tile(LAT, LON, z); bb = merc_bbox(z, x, y)
                  st, h, c, dt = get(tin_url(bb, "EPSG:3857", px, px))
                  riga = f"z{z} {px}px EPSG:3857: HTTP {st}, {dt:.1f}s, {len(c)} B, {h.get('content-type','').split(';')[0]}"
                  if st == 200 and c[:2] in (b"II", b"MM"):
                      a, p = leggi_tiff(c); nd = (a <= -9998); v = a[~nd]
                      riga += f" → {a.dtype} {a.shape}, senza dato {nd.mean():.1%}, quote {v.min():.1f}..{v.max():.1f}" if v.size else f" → {a.dtype} {a.shape}, tutto senza dato"
                  else: riga += " → " + testo(c, 200)
                  print(riga)
              z = 13; x, y = tile(LAT, LON, z); bb = merc_bbox(z, x, y)
              a3 = leggi_tiff(get(tin_url(bb, "EPSG:3857", 256, 256))[2])[0]
              # stessa zona chiesta in gradi
              def inv(mx, my): return mx/M*180, math.degrees(2*math.atan(math.exp(my/M*math.pi))-math.pi/2)
              lo0, la0 = inv(bb[0], bb[1]); lo1, la1 = inv(bb[2], bb[3])
              a4 = leggi_tiff(get(tin_url((lo0, la0, lo1, la1), "EPSG:4326", 256, 256))[2])[0]
              ok = (a3 > -9998) & (a4 > -9998)
              print("stessa tessera chiesta in 3857 e in 4326: differenza media %.2f m, massima %.1f m su %d pixel (la griglia in gradi non è quella mercatore: ci si aspetta qualche metro lungo i pendii)" % (np.abs(a3-a4)[ok].mean(), np.abs(a3-a4)[ok].max(), ok.sum()))
              # 12 tessere insieme
              x, y = tile(LAT, LON, 13)
              def una(k):
                  bb = merc_bbox(13, x+(k % 4)-1, y+(k // 4)-1); return get(tin_url(bb, "EPSG:3857", 512, 512))
              t0 = time.time()
              with ThreadPoolExecutor(12) as ex: es = list(ex.map(una, range(12)))
              print(f"12 tessere z13 da 512 px in parallelo: totale {time.time()-t0:.1f}s, stati {sorted(set(e[0] for e in es))}, tempo max {max(e[3] for e in es):.1f}s, {sum(len(e[2]) for e in es)//1024} KB")
              t0 = time.time()
              with ThreadPoolExecutor(6) as ex: es = list(ex.map(una, range(12)))
              print(f"stesse 12 con 6 alla volta: totale {time.time()-t0:.1f}s")
          sezione("TINITALY WCS in Web Mercator: formato, tempi", mercatore)
          # ---------- 3) Ministero: il WCS dà il LiDAR come quota?
          P = "http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/servizi-LiDAR/LIDAR_MARCHE.map"
          def ministero():
              st, h, c, dt = get(P + "&SERVICE=WCS&VERSION=1.0.0&REQUEST=GetCapabilities")
              t = c.decode("utf8", "replace")
              print("WCS 1.0.0 capabilities:", st, f"{dt:.1f}s", len(c), "B")
              for m in re.finditer(r"<CoverageOfferingBrief>(.*?)</CoverageOfferingBrief>", t, re.S):
                  print("  copertura:", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", m.group(1))).strip()[:160])
              print("  testo (inizio):", testo(c, 500))
              st, h, c, dt = get(P + "&SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCapabilities")
              t = c.decode("utf8", "replace")
              print("WCS 2.0.1 capabilities:", st, f"{dt:.1f}s", len(c), "B", "| id:", re.findall(r"CoverageId>([^<]+)<", t)[:20], "| formati:", re.findall(r"formatSupported>([^<]+)<", t)[:10])
              print("  testo (inizio):", testo(c, 500))
              ids = re.findall(r"<(?:wcs:)?(?:name|CoverageId)>([^<]+)<", t)
              st, h, c, dt = get(P + "&SERVICE=WCS&VERSION=1.0.0&REQUEST=DescribeCoverage&COVERAGE=EL.LIDAR.MARCHE.1x1.DTM")
              print("DescribeCoverage 1x1.DTM (1.0.0):", st, f"{dt:.1f}s", len(c), "B →", testo(c, 900))
          sezione("Ministero: WCS del LiDAR Marche, capacità", ministero)
          def ministero_dati():
              cx, cy = 12.90, 43.40            # finestra con dati trovata nella prima diagnosi
              d = 0.004
              bb = (cx-d, cy-d, cx+d, cy+d)
              base = P + "&SERVICE=WCS&VERSION=1.0.0&REQUEST=GetCoverage&COVERAGE=EL.LIDAR.MARCHE.1x1.DTM&CRS=EPSG:4326&BBOX=" + ",".join("%.6f" % v for v in bb)
              risultato = {}
              for fmt in ("GTiff", "GeoTIFF", "image/tiff", "GTiff_float", "AAIGRID"):
                  for w in (128,):
                      st, h, c, dt = get(base + f"&WIDTH={w}&HEIGHT={w}&FORMAT={fmt}", 120)
                      riga = f"GetCoverage {fmt} {w}px: HTTP {st}, {dt:.1f}s, {len(c)} B, {h.get('content-type','').split(';')[0]}"
                      if st == 200 and c[:2] in (b"II", b"MM"):
                          a, p = leggi_tiff(c); riga += f" → {a.dtype} {a.shape}, quote {np.nanmin(a):.2f}..{np.nanmax(a):.2f}, valori distinti {len(np.unique(a))}"
                          risultato[fmt] = a
                      else: riga += " → " + testo(c, 250)
                      print(riga)
              if risultato:
                  a = next(iter(risultato.values())).astype("float64")
                  t_ = leggi_tiff(get(tin_url(bb, "EPSG:4326", 128, 128))[2])[0].astype("float64")
                  ok = (a > -500) & (a < 3000) & (t_ > -500)
                  if ok.sum():
                      dd = (a - t_)[ok]
                      print(f"LiDAR Ministero − TINITALY: {ok.sum()} punti validi su {a.size}, media {dd.mean():+.2f} m, scarto {dd.std():.2f} m, massima {np.abs(dd).max():.1f} m")
                  big = 1000
                  st, h, c, dt = get(base + f"&WIDTH={big}&HEIGHT={big}&FORMAT=" + next(iter(risultato)), 180)
                  print(f"finestra 0,008° (~700 m) a {big} px: HTTP {st}, {dt:.1f}s, {len(c)} B")
          sezione("Ministero: GetCoverage del DTM 1 m vicino a Fabriano", ministero_dati)
          # ---------- 4) palazzi con altezza (OpenFreeMap)
          def palazzi():
              st, h, c, dt = get("https://tiles.openfreemap.org/planet", 60, {"Origin": ORIGINE})
              print("TileJSON planet:", st, f"CORS {h.get('access-control-allow-origin')}", testo(c, 300))
              z = 14; x, y = tile(LAT, LON, z)
              st, h, c, dt = get(f"https://tiles.openfreemap.org/planet/20260000_000000_pt/{z}/{x}/{y}.pbf", 60, {"Origin": ORIGINE})
              print("tessera con data finta:", st, testo(c, 100))
              import json
              try:
                  tj = json.loads(get("https://tiles.openfreemap.org/planet", 60)[2])
                  url = tj["tiles"][0].replace("{z}", str(z)).replace("{x}", str(x)).replace("{y}", str(y))
                  print("URL tessere:", tj["tiles"][0], "| maxzoom", tj.get("maxzoom"))
                  st, h, c, dt = get(url, 60, {"Origin": ORIGINE})
                  print("tessera vettoriale:", st, f"{dt:.1f}s", len(c), "B, CORS", h.get("access-control-allow-origin"), "| codifica", h.get("content-encoding"))
                  if st == 200:
                      import mapbox_vector_tile as mvt
                      raw = gzip.decompress(c) if c[:2] == b"\x1f\x8b" else c
                      dec = mvt.decode(raw)
                      print("strati:", {k: len(v["features"]) for k, v in dec.items()})
                      if "building" in dec:
                          pr = [f["properties"] for f in dec["building"]["features"]]
                          con = [p for p in pr if p.get("render_height")]
                          print(f"palazzi {len(pr)}, con render_height {len(con)}; esempio:", pr[:3])
              except Exception: print("ERRORE:", traceback.format_exc()[-500:])
          sezione("Palazzi con altezza: OpenFreeMap (tessere vettoriali, CORS)", palazzi)
          # ---------- 5) fino a che zoom c'è l'ortofoto Esri sopra l'Italia interna
          def esri():
              for z in (16, 17, 18, 19):
                  x, y = tile(LAT, LON, z)
                  st, h, c, dt = get(f"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", 60)
                  print(f"Esri World_Imagery z{z}: HTTP {st}, {len(c)} B, {h.get('content-type','').split(';')[0]}")
          sezione("Esri World_Imagery: zoom disponibili", esri)
          print("\nfine")
          PY
          python3 prova.py
